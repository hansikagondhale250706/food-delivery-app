name: Food Delivery App CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Source Files
        run: |
          echo "=== Testing & Validating Code ==="
          test -f index.html || (echo "index.html missing!" && exit 1)
          test -f style.css || (echo "style.css missing!" && exit 1)
          echo "All source files verified successfully."

      - name: Package Application
        run: |
          echo "=== Packaging Application ==="
          mkdir -p dist
          cp index.html style.css dist/
          tar -czvf food-delivery-app.tar.gz -C dist .
          echo "Package created: food-delivery-app.tar.gz"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-delivery-app-build
          path: food-delivery-app.tar.gz
